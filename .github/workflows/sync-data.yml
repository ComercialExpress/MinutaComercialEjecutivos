name: Sync Power BI data from OneDrive

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 min aprox. (GitHub no garantiza el minuto exacto)
  workflow_dispatch:          # botón para correrlo manualmente desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Descargar ejecutivos.json
        env:
          URL: ${{ secrets.ONEDRIVE_EXEC_URL }}
        run: curl -L -f -o ejecutivos.json "${URL}&download=1"

      - name: Descargar kpi.json
        env:
          URL: ${{ secrets.ONEDRIVE_KPI_URL }}
        run: curl -L -f -o kpi.json "${URL}&download=1"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ejecutivos.json kpi.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualización automática de datos Power BI - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
