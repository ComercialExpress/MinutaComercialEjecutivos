name: Sync Power BI data from OneDrive

on:
  schedule:
    - cron: '*/30 * * * *'   # cada ~30 min
  workflow_dispatch:          # botón para correrlo manualmente

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Obtener token de acceso (Microsoft Graph)
        id: auth
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "grant_type=client_credentials" \
            | jq -r .access_token)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "No se pudo obtener el token. Revisa los secrets de Azure."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Convierte un link para compartir de SharePoint/OneDrive al "shareId"
      # que espera el endpoint /shares de Microsoft Graph.
      - name: Codificar URLs para Graph API
        id: encode
        env:
          EXEC_URL: ${{ secrets.ONEDRIVE_EXEC_URL }}
          KPI_URL: ${{ secrets.ONEDRIVE_KPI_URL }}
          TIENDA_URL: ${{ secrets.ONEDRIVE_TIENDA_URL }}
          TIENDA_KPI_URL: ${{ secrets.ONEDRIVE_TIENDA_KPI_URL }}
        run: |
          encode() {
            printf '%s' "$1" | base64 -w 0 | tr '+/' '-_' | tr -d '=' | sed 's/^/u!/'
          }
          echo "exec_share=$(encode "$EXEC_URL")" >> "$GITHUB_OUTPUT"
          echo "kpi_share=$(encode "$KPI_URL")" >> "$GITHUB_OUTPUT"
          echo "tienda_share=$(encode "$TIENDA_URL")" >> "$GITHUB_OUTPUT"
          echo "tienda_kpi_share=$(encode "$TIENDA_KPI_URL")" >> "$GITHUB_OUTPUT"

      - name: Descargar ejecutivos.json vía Graph API
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          SHARE_ID: ${{ steps.encode.outputs.exec_share }}
        run: |
          HTTP_STATUS=$(curl -s -L -H "Authorization: Bearer ${TOKEN}" \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o ejecutivos.json)
          echo "HTTP_STATUS=${HTTP_STATUS}"
          head -c 1000 ejecutivos.json
          echo ""
          if [ "$HTTP_STATUS" -ge 400 ]; then exit 1; fi
          if ! jq empty ejecutivos.json 2>/dev/null; then exit 1; fi

      - name: Descargar kpi.json vía Graph API
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          SHARE_ID: ${{ steps.encode.outputs.kpi_share }}
        run: |
          HTTP_STATUS=$(curl -s -L -H "Authorization: Bearer ${TOKEN}" \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o kpi.json)
          echo "HTTP_STATUS=${HTTP_STATUS}"
          head -c 1000 kpi.json
          echo ""
          if [ "$HTTP_STATUS" -ge 400 ]; then exit 1; fi
          if ! jq empty kpi.json 2>/dev/null; then exit 1; fi

      - name: Descargar tienda.json vía Graph API
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          SHARE_ID: ${{ steps.encode.outputs.tienda_share }}
        run: |
          HTTP_STATUS=$(curl -s -L -H "Authorization: Bearer ${TOKEN}" \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o tienda.json)
          echo "HTTP_STATUS=${HTTP_STATUS}"
          head -c 1000 tienda.json
          echo ""
          if [ "$HTTP_STATUS" -ge 400 ]; then exit 1; fi
          if ! jq empty tienda.json 2>/dev/null; then exit 1; fi

      - name: Descargar tienda_kpi.json vía Graph API
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          SHARE_ID: ${{ steps.encode.outputs.tienda_kpi_share }}
        run: |
          HTTP_STATUS=$(curl -s -L -H "Authorization: Bearer ${TOKEN}" \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/shares/${SHARE_ID}/driveItem/content" \
            -o tienda_kpi.json)
          echo "HTTP_STATUS=${HTTP_STATUS}"
          head -c 1000 tienda_kpi.json
          echo ""
          if [ "$HTTP_STATUS" -ge 400 ]; then exit 1; fi
          if ! jq empty tienda_kpi.json 2>/dev/null; then exit 1; fi

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ejecutivos.json kpi.json tienda.json tienda_kpi.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualización automática de datos Power BI - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
