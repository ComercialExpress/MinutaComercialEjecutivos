name: Sync Power BI data from OneDrive (debug)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Probar descarga ejecutivos.json (verbose)
        env:
          URL: ${{ secrets.ONEDRIVE_EXEC_URL }}
        run: |
          curl -L -v -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o ejecutivos_test.json \
            -w "\nHTTP_STATUS:%{http_code}\nCONTENT_TYPE:%{content_type}\n" \
            "${URL}&download=1" 2> curl_verbose.log || true
          echo "----- Primeras líneas del archivo descargado -----"
          head -c 500 ejecutivos_test.json || true
          echo ""
          echo "----- Log verbose de curl (headers de la respuesta) -----"
          grep -E "^< HTTP|^< Location|^< WWW-Authenticate" curl_verbose.log || cat curl_verbose.log
