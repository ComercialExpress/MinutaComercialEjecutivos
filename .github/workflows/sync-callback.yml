name: Sync Callback y encuestas EPA
on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min, igual que sync-data.yml
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions
  push:
    paths:
      - 'sync_epa.py'
      - 'sync_callback.py'
      - '.github/workflows/sync-callback.yml'
concurrency:
  group: sync-callback-epa
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests openpyxl
      - name: Debug - check secret lengths (no expone valores)
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          echo "TENANT_ID length: ${#TENANT_ID}"
          echo "CLIENT_ID length: ${#CLIENT_ID}"
          echo "CLIENT_SECRET length: ${#CLIENT_SECRET}"
      - name: Run sync script
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python sync_callback.py
      - name: Actualizar encuestas EPA desde SharePoint
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EPA_SITE_ID: ${{ vars.EPA_SITE_ID }}
          EPA_FOLDER_PATH: ${{ vars.EPA_FOLDER_PATH }}
        run: python sync_epa.py --graph
      - name: Commit updated JSON and EPA panel
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add callback_registros.json PanelCallbackEpa.html
          if ! git diff --staged --quiet; then
            git commit -m "Actualización automática de datos Callback y EPA - $(date +'%Y-%m-%d %H:%M')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main
          git push
      - name: Reconstruir GitHub Pages con las bases actualizadas
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
