name: Materialize PDF Editor

on:
  push:
    paths:
      - 'editor-pdf/.payload/**'
      - '.github/workflows/materialize-pdf-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build real editor HTML from validated payload parts
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path('editor-pdf/.payload').glob('part*.txt'))
          if len(parts) != 9:
              raise RuntimeError(f'Expected 9 payload parts, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          payload = base64.b64decode(encoded)
          html = gzip.decompress(payload).decode('utf-8')

          if '<title>PDF Studio · Editor local</title>' not in html:
              raise RuntimeError('Unexpected editor title')
          for marker in ('pdf-lib@1.17.1', '@pdf-lib/fontkit@1.1.1', 'pdf.js/4.10.38'):
              if marker not in html:
                  raise RuntimeError(f'Missing dependency marker: {marker}')
          if len(html.encode('utf-8')) < 50000:
              raise RuntimeError('Editor HTML is unexpectedly small')

          out = Path('editor-pdf/index.html')
          out.write_text(html, encoding='utf-8')
          print('Editor bytes:', len(html.encode('utf-8')))
          print('SHA256:', hashlib.sha256(html.encode('utf-8')).hexdigest())

      - name: Commit real editor HTML
        run: |
          if git diff --quiet -- editor-pdf/index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-pdf/index.html
          git commit -m "Publish real online PDF editor"
          git push
