name: Sync DepositosSucursalesBCI
on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 min, igual que sync-data.yml y sync-callback.yml
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Debug - check secret lengths (no expone valores)
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          echo "TENANT_ID length: ${#TENANT_ID}"
          echo "CLIENT_ID length: ${#CLIENT_ID}"
          echo "CLIENT_SECRET length: ${#CLIENT_SECRET}"
      - name: Run sync script
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python sync_depositos.py
      - name: Subir muestra cruda como artifact (para verificar mapeo de columnas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depositos-raw-sample
          path: depositos-raw-sample.json
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add depositos.json
          git diff --staged --quiet || git commit -m "Actualización automática de datos Depósitos BCI - $(date +'%Y-%m-%d %H:%M')"
          git push
      - name: Purgar caché de jsDelivr (depositos.json)
        # jsDelivr es el primer mirror que consulta cuadratura_caja.html
        # (ver CONFIG.depositosSources) y cachea en el edge independientemente
        # de la caché del navegador (el fetch() del HTML ya usa cache:no-store,
        # pero eso no toca la caché del CDN). Sin este purge, un cambio recién
        # commiteado puede tardar horas en reflejarse en el dashboard aunque
        # el workflow y el commit hayan sido exitosos. No requiere token ni
        # secret nuevo — es un GET público a la API de purge de jsDelivr.
        run: |
          curl -s -o /dev/null -w "jsDelivr purge depositos.json -> HTTP %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/ComercialExpress/MinutaComercialEjecutivos@main/depositos.json"
